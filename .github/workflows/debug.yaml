name: Phi Recorder CI
on:
  push:
    branches:
      - '*'
    paths:
      - 'src/**'
      - 'src-tauri/src/**'
      - 'src-tauri/config.toml'
      - '.github/workflows/debug.yaml'
  workflow_dispatch:


jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        # You can remove libayatana-appindicator3-dev if you don't use the system tray feature.
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libssl-dev pkg-config libswresample-dev

      - name: Rust setup (gnu)
        if: matrix.platform == 'ubuntu-24.04'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-gnu

      - name: Rust setup (msvc)
        if: matrix.platform == 'windows-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-msvc

      # prpr-avc/build.rs links ffmpeg from <crate>/static-lib/<TARGET>/, which
      # this repository gitignores, so a fresh checkout cannot link it. The
      # official prpr-avc-ffmpeg release ships one flat tarball per target.
      # windows-latest also needs the MSVC .lib files, hence .lib below.
      - name: Fetch ffmpeg static libs
        shell: bash
        run: |
          set -euo pipefail
          tag=20260408_v0
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            dest="$PWD/prpr-avc/static-lib/x86_64-pc-windows-msvc"
            mkdir -p "$dest"
            curl -fsSL --retry 3               "https://github.com/TeamFlos/prpr-avc-ffmpeg/releases/download/$tag/x86_64-pc-windows-msvc.tar.gz"               -o /tmp/avc.tar.gz
            tar -xzf /tmp/avc.tar.gz -C "$dest"
            # the Windows build links the import libraries, not the .a files
            for f in libavcodec libavformat libavutil libswresample libswscale; do
              if [ -f "$dest/$f.lib" ]; then
                cp "$dest/$f.lib" "$dest/$f.a"
              fi
            done
          else
            dest="$PWD/prpr-avc/static-lib/x86_64-unknown-linux-gnu"
            mkdir -p "$dest"
            curl -fsSL --retry 3               "https://github.com/TeamFlos/prpr-avc-ffmpeg/releases/download/$tag/x86_64-unknown-linux-gnu.tar.gz"               -o /tmp/avc.tar.gz
            tar -xzf /tmp/avc.tar.gz -C "$dest"
          fi
          ls -la "$dest"

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-all-crates: "true"

      # pnpm-lock.yaml is lockfileVersion 9.0; pnpm 8 cannot read it.
      - name: Sync node version and setup cache
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install frontend dependencies
        # If you don't have `beforeBuildCommand` configured you may want to build your frontend here too.
        run: pnpm install # Change this to npm, yarn or pnpm.

      - name: Build the app
        uses: tauri-apps/tauri-action@v0

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        if: matrix.platform == 'windows-latest'
        with:
          name: windows-installer
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
      - name: Upload Linux Installer
        uses: actions/upload-artifact@v4
        if: matrix.platform == 'ubuntu-24.04'
        with:
          name: linux-installer
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
