name: Phi Recorder Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        # You can remove libayatana-appindicator3-dev if you don't use the system tray feature.
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libssl-dev pkg-config libswresample-dev

      - name: Rust setup (gnu)
        if: matrix.platform == 'ubuntu-24.04'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-gnu

      - name: Rust setup (msvc)
        if: matrix.platform == 'windows-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-msvc

      # Same as debug.yaml: prpr-avc cannot link without the static libs, and
      # this repository gitignores them.
      - name: Fetch ffmpeg static libs
        shell: bash
        run: |
          set -euo pipefail
          tag=20260408_v0
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            dest="$PWD/prpr-avc/static-lib/x86_64-pc-windows-msvc"
            url="x86_64-pc-windows-msvc.tar.gz"
          else
            dest="$PWD/prpr-avc/static-lib/x86_64-unknown-linux-gnu"
            url="x86_64-unknown-linux-gnu.tar.gz"
          fi
          mkdir -p "$dest"
          curl -fsSL --retry 3             "https://github.com/TeamFlos/prpr-avc-ffmpeg/releases/download/$tag/$url"             -o /tmp/avc.tar.gz
          tar -xzf /tmp/avc.tar.gz -C "$dest"
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            for f in libavcodec libavformat libavutil libswresample libswscale; do
              [ -f "$dest/$f.lib" ] && cp "$dest/$f.lib" "$dest/$f.a"
            done
          fi
          ls -la "$dest"

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-all-crates: "true"

      # pnpm-lock.yaml is lockfileVersion 9.0; pnpm 8 cannot read it.
      - name: Sync node version and setup cache
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install frontend dependencies
        # If you don't have `beforeBuildCommand` configured you may want to build your frontend here too.
        run: pnpm install # Change this to npm, yarn or pnpm.

      - name: Build the app
        uses: tauri-apps/tauri-action@v0

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }} # This only works if your workflow triggers on new tags.
          releaseName: 'Phi Recorder v__VERSION__' # tauri-action replaces \_\_VERSION\_\_ with the app version.
          releaseBody: 'From GitHub Action'
          releaseDraft: true
          prerelease: false
